<!DOCTYPE html>
<html>
    <body>
        <h1>Javascript Array Methods</h1>
        <h4></h4>
        <h3>The join() and pop() method</h3>
        <p>The join() method joins array elements into a string and the pop() method removes the last element from an array.</p>
        <p id="myjoin"></p>
        <p id="myfirstpop"></p>
        <p id="mysecondpop"></p>
        <script>
            var fruits = ["Banana", "Orange", "Apple", "Mango", "Grapes"];
            document.getElementById("myjoin").innerHTML = fruits.join(" * ");
            document.getElementById("myfirstpop").innerHTML = fruits;
            fruits.pop();
            document.getElementById("mysecondpops").innerHTML = fruits;
        </script>
    </body>
</html>
